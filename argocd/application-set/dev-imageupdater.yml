apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: chai-dev-updater
  namespace: argocd
spec:
  namespace: argocd

  writeBackConfig:
    method: git
    gitConfig:
      branch: main
      writeBackTarget: kustomization

  applicationRefs:
    - namePattern: "chai-app-dev"

      images:
        - alias: chai-app
          imageName: mrhemantksharma/chai-app

          commonUpdateSettings:
            updateStrategy: latest
            allowTags: "regexp:^dev-.*$"

