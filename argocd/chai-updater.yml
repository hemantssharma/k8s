apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: chaiapp-updater
  namespace: argocd
spec:
  namespace: argocd

  writeBackConfig:
    method: git
    gitConfig:
      branch: main
      writeBackTarget: "kustomization"

  applicationRefs:
    - namePattern: "chai-app"
      images:
        - alias: chai-app
          imageName: mrhemantksharma/chai-app
